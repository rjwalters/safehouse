name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: build / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build
        run: cargo build --workspace --verbose
      - name: cargo test
        run: cargo test --workspace --verbose

  room-cutover-dry-run:
    name: room-cutover.sh --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/room-cutover.sh
      - name: dry run with no arguments (sample data)
        run: scripts/room-cutover.sh --dry-run
      - name: dry run never opens the daemon socket
        run: |
          # No SAFEHOUSED_SOCKET/SAFEHOUSE_PERSONA in the environment at all —
          # a dry run must render the full plan without needing them.
          env -u SAFEHOUSED_SOCKET -u SAFEHOUSE_PERSONA \
            scripts/room-cutover.sh --dry-run \
              --room-name loom-fleet-vN \
              --invite "@safehouse-bot:example.com @safehoused-worker1:example.com"
      - name: dry-run output covers the required plan sections
        run: |
          out="$(scripts/room-cutover.sh --dry-run --room-name loom-fleet-vN \
            --invite '@safehouse-bot:example.com @safehoused-worker1:example.com')"
          for marker in \
            'safehouse_create_room' \
            'LOOM_SAFEHOUSE_ROOM' \
            'launchd' \
            'systemd' \
            'Egress allowlist' \
            'LOOM_SAFEHOUSE_RECONCILE_MAX_AGE_SECS' \
            '!FZ8oYmGnszTpYdXUGz' \
            '!MQP2aSTA5uDu7czxYZ' \
            'Traps'; do
            echo "$out" | grep -qF -- "$marker" || { echo "missing expected marker: $marker" >&2; exit 1; }
          done
      - name: missing required flags fails outside --dry-run
        run: |
          if scripts/room-cutover.sh --invite "@a:b.com"; then
            echo "expected failure: --room-name is required outside --dry-run" >&2
            exit 1
          fi
