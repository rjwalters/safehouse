name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: run the same suites against the combined queue tree.
  # On merge_group events actions/checkout (below) defaults to
  # `github.sha`, which is the merge-group commit — not the PR head
  # and not main — so every job here tests the integrated change.
  merge_group:
    types: [checks_requested]

concurrency:
  # PR and push runs keep their current groups (per-branch, superseded
  # runs cancel). A merge-group run is keyed by the merge group's
  # unique head SHA and cannot be cancelled or superseded by any
  # PR/push run, since the group names can never collide.
  group: ci-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: build / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build
        run: cargo build --workspace --verbose
      - name: cargo test
        run: cargo test --workspace --verbose

  room-cutover-dry-run:
    name: room-cutover.sh --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/room-cutover.sh
      - name: dry run with no arguments (sample data)
        run: scripts/room-cutover.sh --dry-run
      - name: dry run never opens the daemon socket
        run: |
          # No SAFEHOUSED_SOCKET/SAFEHOUSE_PERSONA in the environment at all —
          # a dry run must render the full plan without needing them.
          env -u SAFEHOUSED_SOCKET -u SAFEHOUSE_PERSONA \
            scripts/room-cutover.sh --dry-run \
              --room-name loom-fleet-vN \
              --invite "@safehouse-bot:example.com @safehoused-worker1:example.com"
      - name: dry-run output covers the required plan sections
        run: |
          out="$(scripts/room-cutover.sh --dry-run --room-name loom-fleet-vN \
            --invite '@safehouse-bot:example.com @safehoused-worker1:example.com')"
          for marker in \
            'safehouse_create_room' \
            'LOOM_SAFEHOUSE_ROOM' \
            'launchd' \
            'systemd' \
            'Egress allowlist' \
            'LOOM_SAFEHOUSE_RECONCILE_MAX_AGE_SECS' \
            '!FZ8oYmGnszTpYdXUGz' \
            '!MQP2aSTA5uDu7czxYZ' \
            'Traps'; do
            echo "$out" | grep -qF -- "$marker" || { echo "missing expected marker: $marker" >&2; exit 1; }
          done
      - name: missing required flags fails outside --dry-run
        run: |
          if scripts/room-cutover.sh --invite "@a:b.com"; then
            echo "expected failure: --room-name is required outside --dry-run" >&2
            exit 1
          fi
      - name: omitted --invite fails, but explicitly empty --invite is accepted, outside --dry-run
        run: |
          # Omitting --invite entirely must still fail (forces a deliberate choice).
          out="$(scripts/room-cutover.sh --room-name x 2>&1)" && {
            echo "expected failure: --invite is required outside --dry-run" >&2
            exit 1
          }
          echo "$out" | grep -qF -- "--invite is required" || {
            echo "expected the missing-invite error, got: $out" >&2
            exit 1
          }
          # A scratch room with zero invitees (--invite "") is a documented,
          # legitimate live-run test (docs/runbooks/room-cutover.md) — it must
          # pass the flag-validation gate and fail later, on the missing daemon
          # socket, not on --invite.
          out="$(env -u SAFEHOUSED_SOCKET -u SAFEHOUSE_PERSONA scripts/room-cutover.sh --room-name x --invite "" 2>&1)" && {
            echo "expected failure: SAFEHOUSED_SOCKET must be set" >&2
            exit 1
          }
          echo "$out" | grep -qF -- "SAFEHOUSED_SOCKET must be set" || {
            echo "empty --invite should pass validation and fail on missing SAFEHOUSED_SOCKET, got: $out" >&2
            exit 1
          }

  agent-skill:
    name: agent skill (install-skill.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/install-skill.sh scripts/test-install-skill.sh
      - name: skill frontmatter, documented commands, installer
        run: scripts/test-install-skill.sh
