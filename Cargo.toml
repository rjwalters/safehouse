[workspace]
resolver = "2"
members = ["safehoused", "spikes/qj-coldstart"]

[workspace.dependencies]
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
