[workspace]
resolver = "2"
members = ["safehoused", "safehouse-mcp"]

[workspace.dependencies]
# "bundled-sqlite" (not "sqlite") vendors sqlite via libsqlite3-sys/bundled instead of
# linking the system library. Cargo feature unification means the direct `rusqlite`
# dep below (mailbox store, D17) shares the same libsqlite3-sys and gets the bundled
# build too — one flag covers both consumers. Without it, a bare Linux toolchain
# fails to link with "unable to find library -lsqlite3" unless libsqlite3-dev is
# installed (see README "Running it" > Prerequisites).
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "bundled-sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already vendored transitively via matrix-sdk-sqlite; used directly here for
# the mailbox read-cursor store (D17), not for any Matrix state.
rusqlite = "0.37"
# Already vendored transitively via matrix-sdk; used directly here only to
# consume `Room::parent_spaces()`'s `Stream` (Space hierarchy in `list_rooms`).
futures-util = { version = "0.3", default-features = false }
# New direct dependency (#31): outbound-only HTTP POST for the public
# completion feed egress sink. `rustls-tls` matches the TLS stack matrix-sdk
# already pulls in transitively (see the `reqwest`/`hyper-rustls` entries
# matrix-sdk's oauth2 support vendors into Cargo.lock) rather than adding a
# second TLS implementation (`native-tls`/OpenSSL) to the dependency tree.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
