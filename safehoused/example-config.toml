# safehoused example config — copy to config.toml, fill in the real values,
# and run: safehoused config.toml   (or set SAFEHOUSED_CONFIG=/path/to/config.toml)
#
# This file documents every field the daemon's Config struct accepts
# (safehoused/src/main.rs). Config parsing uses #[serde(deny_unknown_fields)],
# so a typo'd or removed field name will fail fast at startup rather than
# silently doing nothing.
#
# See ../README.md "Running it" for the end-to-end walkthrough (create the
# bot user on the homeserver, write this file, run the daemon, invite it to
# a room).

# --- Mandatory fields --------------------------------------------------

# The homeserver's client-server API base URL. Point this at your own
# instance — see docs/research/2026-07-26-homeserver.md for the tuwunel
# setup this project targets.
homeserver = "https://matrix.example.com"

# The bot's own Matrix account, created ahead of time on the homeserver
# (the daemon never registers itself — see "Running it" in the README).
# This is a login, not a Matrix user ID: no "@" prefix, no ":server" suffix.
username = "safehouse-bot"
password = "change-me"

# Where the daemon keeps its persistent state: the encrypted sqlite crypto
# store (state_dir/store) and the session blob (state_dir/session.json).
# Created on first (cold) start. Must persist across restarts — losing it
# means the daemon shows up as a brand-new, unverified device next boot.
state_dir = "/var/lib/safehoused"

# Passphrase used to encrypt the sqlite store at rest. Distinct from
# recovery_passphrase below: this one only protects the on-disk database
# file and never leaves the host.
store_passphrase = "change-me-too"

# The ONLY headless way back after losing the crypto store (disk failure,
# state_dir wiped, etc). This is mandatory config, not optional — the
# daemon has no other path to recover room keys and re-establish a trusted
# device after a store loss (see docs/decisions.md D10). On first-ever boot
# for this account the daemon mints secret storage and locks it behind this
# passphrase; on every subsequent boot after a store wipe, this passphrase
# is what lets the new device recover the old one's keys instead of coming
# up as an unverified stranger. Treat it like the recovery phrase for a
# hardware wallet: write it down somewhere durable, off this host.
recovery_passphrase = "change-me-as-well"

# --- Optional fields (all have safe defaults) ---------------------------

# Destructive escape hatch. If recovery with recovery_passphrase ever fails
# (e.g. wrong passphrase, corrupted secret storage) the only remaining path
# is to reset recovery — which orphans every room key currently held in
# server-side backup, permanently. Defaults to false; only flip this to
# true if you have accepted that loss and understand the daemon will log a
# startup warning while it's armed.
# recovery_reset_allowed = false

# Allowlist of local agent personas permitted to attach over the unix
# socket (see docs/protocol/envelope-v1.md §6). Each entry must be
# lowercase ASCII letters, digits, or underscores, 1-64 chars
# (safehoused/src/envelope.rs::valid_persona) — the daemon refuses to
# start if any entry fails that check. Defaults to an empty list, which
# means NO agent can connect over the socket; the daemon still joins
# rooms and mirrors traffic to stdout even with zero personas configured.
#
# Convention (not enforced by the daemon): reserve a persona named
# "operator" for humans/scripts running `safehouse-mcp read|send|check|
# list-rooms` one-shot (see README "Scripting the socket") rather than
# borrowing a real fleet agent's identity for ad hoc socket access — keeps
# operator traffic out of any real agent's mailbox and out of its identity
# in the room. One trade-off: a broadcast (`to: "*"`) is delivered to every
# allowlisted persona's mailbox, including "operator" — an operator persona
# that's allowlisted but rarely/never calls `check` accumulates unread
# mailbox rows indefinitely. Harmless for correctness (the mailbox is a
# rebuildable view over the room timeline, D16/D17), but worth knowing;
# prefer the stateless `read` op for casual/scripted access, which never
# touches any mailbox cursor.
# personas = ["writer_agent", "research_agent", "operator"]

# Unix-domain socket path the daemon listens on for local agent RPC
# (hello/send/create_room/add_to_space/list_rooms/read/check/invite — see
# safehoused/src/rpc.rs). AF_UNIX only, by design — never a TCP listener
# (docs/decisions.md D8). Defaults to "<state_dir>/safehoused.sock" when
# omitted.
# socket_path = "/var/lib/safehoused/safehoused.sock"

# Invite-acceptance policy (issue #39). By default the daemon accepts EVERY
# invite addressed to its own account (see on_invite in
# safehoused/src/main.rs) — this is safe on a sealed homeserver with
# registration off, since any invite necessarily comes from a user the
# operator already controls. Setting this field makes that policy explicit
# and, if you want it, stricter: only invites whose sender is a full Matrix
# user id (`@user:server`) in this list are joined; every other invite is
# declined (logged, not joined). Leaving this commented out / unset
# preserves today's accept-any behavior — this is NOT a default change.
#
# Onboarding a new host into an existing room (the loom#3998 fleet pilot):
# from an already-onboarded host's socket, send `{"op": "invite", "room":
# "<id|name|alias>", "user": "@new-host-bot:example.com"}` — the new host's
# daemon then auto-joins on its next sync, even if it's still cold-starting.
# invite_allowlist = ["@ops-console:example.com"]

# Which trust model this homeserver actually has (issue #198). Default
# "sealed" — federation off, registration off (docs/decisions.md D5/D12) —
# which is what every config written before this key implicitly meant, and
# why the accept-any invite policy above is safe there: every account on the
# server is already the operator's. Set "federated" when the daemon logs into
# a homeserver reachable from other servers and/or open to registration
# (matrix.org, an org-wide homeserver). In that mode anyone, anywhere, can
# invite the bot, so `invite_allowlist` above stops being optional hardening:
# the daemon REFUSES TO BOOT unless it is set to a non-empty list. Any other
# value is a config parse error, not a silent fallback to "sealed".
# homeserver_mode = "sealed"

# Visible "unknown persona" ack (envelope-v1 §5.1, issue #195). When a human
# message starts with @token and token is no local persona, the daemon posts
# an ack so a typo isn't silently misdelivered. That's right in an agent room
# and noise in a room where people address each other ("@alice can you look"),
# where every such line would draw an ack from the bot's account. false
# suppresses the ack only; the message still arrives as a broadcast.
# unknown_persona_ack = true

# Leave a room once the daemon is its only remaining member (issue #201).
# Default false — today's behavior, in which the bot stays in a room everyone
# else has left: it keeps syncing it, replays its history at every start, and
# keeps that room's thread state alive, with nothing telling an agent the room
# is empty. Set true and the daemon leaves AND forgets such a room after a
# 10-minute grace period, measured from the membership event that emptied it,
# so a quick leave-and-rejoin never pushes the bot out behind someone. It
# checks once at startup too, so a room that emptied while the daemon was down
# is left on the next boot. Never applies to a room with a pending invite
# (something the operator is still setting up) or to a server-notices room
# (tagged `m.server_notice` — the homeserver owns it). Each automatic leave is
# logged as `safehoused: leaving <room> (alone since <ts>)`. Getting the daemon
# out of a specific room by hand is the `leave` socket op instead:
# `{"op": "leave", "room": "<id|name|alias>", "reason": "..."}`, or
# `safehouse-mcp leave --room <id|name|alias>`.
# leave_when_alone = false

# Per-persona mailbox store (docs/decisions.md D16/D17): a sqlite database
# holding, for each registered persona, its unread-mail cursor. This is a
# derived view over the room timeline, not a second source of truth — the
# room stays authoritative; this file just remembers what each persona has
# already consumed, so a `safehouse_check` after a daemon restart still
# returns exactly what was missed. Defaults to
# "<state_dir>/mailbox.sqlite3" when omitted.
# mailbox_path = "/var/lib/safehoused/mailbox.sqlite3"

# --- Public completion feed (egress) ------------------------------------

# Opt-in publisher for `completion` envelopes (docs/decisions.md D18,
# docs/design.md §4.1.2, safehoused/src/egress.rs). Leaving the [egress]
# table out entirely disables the feed. Boot-time fail-safe guards
# (safehoused/src/egress.rs::validate_egress_config): if `rooms` is
# non-empty, `deny_patterns` must also be non-empty (the daemon refuses to
# publish unredacted content), and at least one of `sink_url` / `sink_path`
# must be set — otherwise the daemon refuses to start.
#
# [egress]
#
# Room-id allowlist: only completions observed in one of these rooms are
# ever feed-eligible. Empty (the default) means nothing is ever published
# and the whole block is inert.
# rooms = ["!abc123:example.com"]
#
# Mandatory deny-pattern list (literal substrings), applied to every
# string in a completion payload before it is queued.
# deny_patterns = ["secret", ":example.com"]
#
# How long a completion sits in the delay buffer before it is published;
# an edit or redaction of the source event during this window suppresses
# it. Defaults to 0 (publish immediately).
# delay_seconds = 300
#
# Outbound HTTP sink (#31): every published record is POSTed here as
# {"room_id", "event_id", "payload"} JSON, with bounded retry. Strictly
# outbound — the daemon never listens on this or any address (D8). Takes
# priority over sink_path when both are set.
# sink_url = "https://feed.example.com/completions"
#
# Local JSON-lines sink file (#30) — kept for backward compatibility with
# existing configs; a config written from scratch should prefer sink_url.
# Ignored when sink_url is set.
# sink_path = "/var/lib/safehoused/completions.jsonl"

# --- Local voice-note transcription (issue #200) ------------------------

# Opt-in. People send voice notes; in Matrix that is an `m.audio` event whose
# `body` is just a file name, so an agent behind the socket sees "Voice
# message.ogg" and nothing it can act on. With this block present the daemon
# downloads and decrypts the attachment (it holds the room keys — no other
# component can), pipes it to the configured local command, and synthesizes
# the envelope from the transcript instead: `🎙 (voice note, 0:42) <text>`.
# Leaving the [transcribe] table out entirely means no `m.audio` event is
# ever downloaded, decrypted, or piped anywhere — behavior is exactly as it
# was before this feature existed.
#
# LOCAL ONLY, DELIBERATELY. The audio arrived end-to-end encrypted; handing
# it to a hosted transcription API would undo that. `command` is executed as
# a local subprocess with the decrypted bytes on stdin, and
# safehoused/src/transcribe.rs opens no network connection of its own. If you
# ever do want a hosted backend, that must be your own wrapper script, chosen
# explicitly — never something the daemon reaches for implicitly.
#
# Boot-time fail-safe guards
# (safehoused/src/transcribe.rs::validate_transcribe_config): `command` must
# be non-empty and `command[0]` must be an ABSOLUTE path (what runs against
# decrypted E2EE audio must not depend on whatever PATH resolves), and none
# of the three bounds may be 0 — otherwise the daemon refuses to start.
#
# [transcribe]
#
# argv of the local transcriber. It receives the raw decrypted media bytes on
# stdin and writes the transcript to stdout; a non-zero exit (with its first
# stderr line) becomes the visible failure note. Container/codec handling is
# the command's business: a Matrix voice note is typically Opus-in-Ogg, which
# `whisper-cli` cannot read directly, so in practice this points at a small
# wrapper that pipes stdin through ffmpeg into whisper.cpp, e.g.
#
#   #!/bin/sh
#   # /usr/local/bin/whisper-wrapper
#   ffmpeg -loglevel quiet -i pipe:0 -ar 16000 -ac 1 -f wav pipe:1 \
#     | whisper-cli -m /opt/whisper/ggml-base.en.bin -nt -f - "$@"
#
# Model choice: `base.en` (~142 MB) is the recommended starting point on a
# small 2-vCPU host — `small.en` (~466 MB) is noticeably more accurate but
# several times slower per minute of audio, and transcription is
# single-flight here, so a slow model turns a burst of voice notes into a
# queue. Measure on your own host before moving up; `timeout_seconds` is the
# backstop either way.
# command = ["/usr/local/bin/whisper-wrapper", "-d", "{max_millis}"]
#
# Duration cap. Audio longer than this is NEVER silently transcribed in
# part: if `command` contains a `{max_seconds}`/`{max_millis}` placeholder
# (substituted into argv — whisper.cpp's `-d <ms>`) the transcriber trims and
# the body says "first 10:00 transcribed"; without a placeholder the daemon
# cannot trim an encoded Opus stream itself, so over-long audio is not
# transcribed at all and the body says why. Defaults to 600 (10 minutes).
# max_seconds = 600
#
# Wall-clock cap on the transcriber subprocess (it is killed on expiry), on
# the media download, and on how long a queued voice note waits for the
# single-flight slot. Defaults to 120.
#
# NOTE: transcription is awaited inline by the sync loop, so while a voice
# note is being transcribed the daemon processes NO event in ANY room. These
# are three sequential waits, so the worst case is up to ~3x this value
# (6 minutes at the default) of daemon-wide stall per voice note. Raise it
# with that cost in mind. (The single-flight slot rarely contends in
# production, as the sync loop already serializes handlers.)
# timeout_seconds = 120
#
# Size cap, checked against the event's advertised `info.size` BEFORE
# downloading and against the real byte count after. The advertised size is
# sender-controlled: a sender can omit or understate it and bypass the
# pre-download check entirely, in which case the whole attachment is buffered
# in memory before the post-download check can reject it (matrix-sdk has no
# streaming/size-capped download). The real memory bound then is the
# homeserver's own media-upload limit, so this is NOT a hard memory ceiling.
# Defaults to 26214400 (25 MiB).
# max_bytes = 26214400
#
# Also post the transcript back into the room as a threaded `m.notice` under
# the voice note, so the humans see what the agents saw. Addressed at the
# voice note's sender, so it reaches no agent mailbox — the agents already
# have the transcript as the message body. Defaults to false.
# post_transcript = true

# --- Config schema version (issue #101, provisioning parity) ------------

# Which config schema this file was written against. Purely advisory: the
# daemon boots identically whether this is present, absent, or behind the
# binary's current schema (safehoused/src/main.rs::CONFIG_SCHEMA_VERSION;
# query it from a built binary with `safehoused --schema-version`) — it
# logs a one-line warning at boot if the config predates it, and
# `scripts/install.sh` checks the same thing on every re-run and WARNS
# (never rewrites — the installer stays no-clobber on an existing config)
# when a host's config.toml is behind. This exists because a new optional
# field (e.g. [egress] above, #30) otherwise silently no-ops on a host
# whose config predates it, since install.sh never touches an existing
# config.toml. Absent defaults to 0 ("predates this versioning scheme
# entirely") — every config that existed before this field was introduced.
# scripts/install.sh writes this automatically for every config it
# generates; hand-written configs may set it explicitly or leave it out.
# schema_version = 5
