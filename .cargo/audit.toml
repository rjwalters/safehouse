# RustSec advisory policy for scripts/check-advisories.sh (issue #261).
#
# Every ignored advisory MUST carry a one-line `# reason` comment directly above it, e.g.
#   # RUSTSEC-0000-0000: not reachable, we never call the affected API; revisit when X releases a fix
#   "RUSTSEC-0000-0000",
#
# The entries below are the vulnerabilities already present in Cargo.lock on main when this gate
# was introduced. They are suppressed only so the gate can land green; the dependency bumps are
# tracked in #268, which deletes each entry as it bumps the crate. New advisories NOT listed here
# still fail the check.
[advisories]
ignore = [
  # RUSTSEC-2026-0459: libsqlite3-sys 0.38.2 bundled C SQLite CVE; bump to >=0.39.0 tracked in #268
  "RUSTSEC-2026-0459",
  # RUSTSEC-2026-0414: pulldown-cmark 0.13.4 ENABLE_WIKILINKS event growth; bump to >=0.13.5 tracked in #268
  "RUSTSEC-2026-0414",
  # RUSTSEC-2026-0433: pulldown-cmark 0.13.4 nested image wikilinks quadratic parse; bump to >=0.13.6 tracked in #268
  "RUSTSEC-2026-0433",
  # RUSTSEC-2026-0524: quinn-proto 0.11.18 long Retry token panic/memory; bump to >=0.11.19 tracked in #268
  "RUSTSEC-2026-0524",
  # RUSTSEC-2026-0523: quinn-proto 0.11.18 MAX_STREAM_DATA beyond stream limit; bump to >=0.11.19 tracked in #268
  "RUSTSEC-2026-0523",
  # RUSTSEC-2026-0538: quinn-udp 0.5.15 receive loop spin on truncated datagram; bump to >=0.5.16 tracked in #268
  "RUSTSEC-2026-0538",
  # RUSTSEC-2026-0445: vodozemac 0.11.1 degraded secret zeroization; bump to >=0.11.2 tracked in #268
  "RUSTSEC-2026-0445",
  # RUSTSEC-2026-0510: vodozemac 0.11.1 panic decoding malformed Ed25519 keys; bump to >=0.11.2 tracked in #268
  "RUSTSEC-2026-0510",
  # RUSTSEC-2026-0451: vodozemac 0.11.1 degraded secret zeroization; bump to >=0.11.2 tracked in #268
  "RUSTSEC-2026-0451",
]
